# Manual-only bounded comparison: one dispatch, two ARM64 jobs, no retries.
# Configure environment "matched-comparison-approval" with required reviewers FIRST.
# Include these reviewed scripts in the authorized repository; no private paths.
# Hosted Windows ARM (public: 4 CPU/16 GB) and Mac ARM (3 CPU/7 GB) differ.
name: Manual matched ARM64 screen (authorization required)
on:
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: Explicit approved budget; this template grants no permission
        required: true
        type: string
      workload:
        required: true
        type: choice
        default: current17
        options: [current17, normalizedHobl25]
permissions:
  contents: read
jobs:
  compare:
    if: inputs.acknowledgement == 'I_HAVE_APPROVAL_AND_BUDGET'
    environment: matched-comparison-approval
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-11-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: microsoft
          architecture: aarch64
          java-version: ${{ inputs.workload == 'current17' && '17.0.21' || '25.0.5' }}
          check-latest: false
      - name: Static protocol checks (no Java invoked)
        run: |
          & './Generated Files/java-arm-build-optimization/experiments/portable/Test-MatchedComparison.ps1'
      - name: Explicit driver setup, checksum and Windows ARM64 compiler preflight
        env:
          WORKLOAD: ${{ inputs.workload }}
        run: |
          $ErrorActionPreference='Stop'; $PSNativeCommandUseErrorActionPreference=$false
          function ok($name) { if($LASTEXITCODE -ne 0){throw "$name exit=$LASTEXITCODE"} }
          $owned=Join-Path $env:GITHUB_WORKSPACE 'comparison-owned'
          New-Item $owned -ItemType Directory|Out-Null
          $flavor=if($IsWindows){'windows-amd64'}else{'darwin-aarch64'}
          $hash=if($IsWindows){'4DD97B1F26525055CEC960FB5B953B70D1E6606F96F5B096EFA932754FD3E9D0238E00CA97779368F29CB751F1776445C45DA618EA8D0D84692C3B936087309F'}else{'CC2887379788BFB54067DEE4F1E9E570624BE0BE6A73025CC59E24D3EE2525CC23D27FC33A58838A0F1A24CB75600FB0CD0AF3F730E70C2DA3660A9F6BF7DF3E'}
          $zip=Join-Path $owned 'vendor.zip'
          Invoke-WebRequest "https://archive.apache.org/dist/maven/mvnd/1.0.6/maven-mvnd-1.0.6-$flavor.zip" -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA512).Hash -ne $hash){throw 'Vendor ZIP checksum'}
          Expand-Archive $zip (Join-Path $owned 'driver')
          $driverHome=Join-Path $owned "driver/maven-mvnd-1.0.6-$flavor"
          if($IsWindows){
            # Same verified /LD /O2 /MD ARM64 recipe, unchanged public C/header.
            $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            $vs=& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
            ok 'vswhere'; if(-not $vs){throw 'ARM64 MSVC component absent; no install permitted'}
            $native=Join-Path $owned 'native'; New-Item $native -ItemType Directory|Out-Null
            $pin='e0df65807439de579e16632881cf4be14b5a3cca'
            $hashes=@{c='31198B329118419DB30A8178FB438F44953B33F346C30E1BF313DF2F4E6A021E';h='E12BE1E39BB5FD0755B87D151D91712D9606D1118B1F6CCAB6BC2CB0857AA9DF'}
            foreach($ext in 'c','h'){
              $p=Join-Path $native "mvndnative.$ext"
              Invoke-WebRequest "https://raw.githubusercontent.com/apache/maven-mvnd/$pin/native/src/main/native/mvndnative.$ext" -OutFile $p
              if((Get-FileHash $p).Hash-ne$hashes[$ext]){throw 'Public native source checksum mismatch'}
            }
            $dll=Join-Path $native 'mvndnative.dll'
            $cmd="call `"$vs\VC\Auxiliary\Build\vcvarsall.bat`" arm64 >nul && cl /nologo /LD /O2 /MD /I`"$env:JAVA_HOME\include`" /I`"$env:JAVA_HOME\include\win32`" /Fo`"$native\mvndnative.obj`" `"$native\mvndnative.c`" /link /MACHINE:ARM64 /OUT:`"$dll`" /IMPLIB:`"$native\mvndnative.lib`""
            & $env:ComSpec /d /c $cmd; ok 'ARM64 JNI compile'
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $jar=Join-Path $driverHome 'mvn/lib/mvnd/mvnd-native-1.0.6.jar'
            $archive=[IO.Compression.ZipFile]::Open($jar,[IO.Compression.ZipArchiveMode]::Update)
            try{
              $path='org/mvndaemon/mvnd/nativ/Windows/arm64/mvndnative.dll'
              if($archive.GetEntry($path)){throw 'Unexpected pre-existing prototype resource'}
              [IO.Compression.ZipFileExtensions]::CreateEntryFromFile($archive,$dll,$path)|Out-Null
            }finally{$archive.Dispose()}
            Remove-Item (Join-Path $driverHome 'bin/mvnd.exe')
            'LOCAL/UNRELEASED ARM64 JVM-client prototype; NOT official Apache Windows ARM64 distribution. Original LICENSE/NOTICE retained.' | Set-Content (Join-Path $driverHome 'LOCAL-UNRELEASED.txt')
          }else{
            & chmod +x (Join-Path $driverHome 'bin/mvnd') (Join-Path $driverHome 'mvn/bin/mvn'); ok 'driver permissions'
          }
          $project=Join-Path $owned 'project'
          & git -c core.autocrlf=false clone https://github.com/spring-projects/spring-petclinic.git $project; ok 'full clone'
          $pin=if($env:WORKLOAD-eq'current17'){'500158f732419217507c7656904b8e6aa1bcc0d6'}else{'6feeae0f13e0e258eedc99832416b42bb13779b1'}
          & git -C $project -c core.autocrlf=false checkout --detach $pin; ok 'pinned checkout'
          "MVND_HOME=$driverHome" | Add-Content $env:GITHUB_ENV
      - name: Matched package and separate test screen
        env:
          WORKLOAD: ${{ inputs.workload }}
        run: |
          $owned=Join-Path $env:GITHUB_WORKSPACE 'comparison-owned'
          & './Generated Files/java-arm-build-optimization/experiments/portable/Invoke-MatchedComparison.ps1' `
            -ProjectFullClone (Join-Path $owned 'project') -JavaHome $env:JAVA_HOME -MvndHome $env:MVND_HOME `
            -LocalCache (Join-Path $owned 'm2') -OutputDirectory (Join-Path $owned 'evidence') `
            -Workload $env:WORKLOAD -Samples 3 -LoopbackTests -ExclusiveSlotApproved
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: matched-${{ matrix.runner }}-${{ inputs.workload }}
          path: comparison-owned/evidence
          if-no-files-found: error
