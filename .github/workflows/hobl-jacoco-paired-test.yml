# INACTIVE: root review and a separate native qualification/allocation are required.
name: INACTIVE paired HOBL warm test - app JaCoCo scope - not build score
on:
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: Explicit approved two-platform warm-test allocation
        type: string
        required: true
      candidate_reviewed:
        description: Independent runner, integration and functional gates accepted
        type: boolean
        required: true
        default: false
      paired_test_screen:
        description: Exactly two jobs, three warm-test pairs each; NOT five-loop/build parity
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  warm-test:
    if: github.repository == 'yeelam-gordon/spring-petclinic' && inputs.acknowledgement == 'I_HAVE_APPROVAL_AND_BUDGET' && toJSON(inputs.candidate_reviewed) == 'true' && toJSON(inputs.paired_test_screen) == 'true'
    environment: hobl-contract-approval
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-11-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pinned official native Microsoft JDK25
        id: archive
        run: |
          $ErrorActionPreference='Stop'
          if(-not($IsWindows-or$IsMacOS)){throw 'Only reviewed native Windows/Mac jobs'}
          $owned=Join-Path $env:GITHUB_WORKSPACE 'hobl-jacoco-owned'
          $setup=Join-Path $owned 'setup-evidence'
          New-Item $setup -ItemType Directory -Force|Out-Null
          $os=if($IsWindows){'windows'}else{'macos'}
          $ext=if($IsWindows){'zip'}else{'tar.gz'}
          $expected=if($IsWindows){'F227CC459FBD65A42C1B28123D68E207EB500899C1C78238F21A038CD33688A3'}else{'C9CF199844411C8BAFD05722D2547538300523A63FF6207A440C71B175FF7873'}
          $name="microsoft-jdk-25.0.5.0.2-$os-aarch64.$ext"
          $archive=Join-Path $owned $name
          $r=@{status='pending';url="https://aka.ms/download-jdk/$name";expectedSha256=$expected;selected='25.0.5.0.2+1-LTS';scope='HOBLDerivedWarmTest_NOT5Loop_NOTBuild'}
          try{
            Invoke-WebRequest $r.url -OutFile $archive
            $r.actualSha256=(Get-FileHash $archive).Hash
            if($r.actualSha256-cne$expected){throw 'Native JDK archive checksum mismatch'}
            "jdkFile=$archive"|Add-Content $env:GITHUB_OUTPUT
            $r.status='PASS'
          }catch{$r.status='FAIL';$r.error=$_.ToString();throw}
          finally{$r|ConvertTo-Json|Set-Content (Join-Path $setup 'jdk-archive.json')}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        id: java
        with:
          distribution: jdkfile
          jdkFile: ${{ steps.archive.outputs.jdkFile }}
          architecture: aarch64
          java-version: '25.0.5'
          check-latest: false
          settings-path: ${{ github.workspace }}/hobl-jacoco-owned/setup-java-settings
      - name: Self-contained production integration checks - no retained corpus
        id: integration
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$false
          $code='./Generated Files/java-arm-build-optimization/experiments/hobl-jacoco-paired-test'
          if((Get-FileHash "$code/Invoke-HoblJacocoJob.ps1").Hash-cne'70A52052E1857E8FB939D2C705B7FAA17052437ADBF55143EFF887F4CF7086A2'){throw 'Reviewed job integration changed'}
          if((Get-FileHash "$code/Test-HoblJacocoIntegration.ps1").Hash-cne'70B094261B0BB128080214AC10A9021BEF9196B79980192DA598750352FC9303'){throw 'Reviewed self-contained integration test changed'}
          & "$code/Test-HoblJacocoIntegration.ps1" -FixtureRoot (Join-Path $env:GITHUB_WORKSPACE 'hobl-jacoco-owned/integration-fixtures')
      - name: Ordinary canonical source at exact HOBL pin
        id: source
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$false
          $owned=Join-Path $env:GITHUB_WORKSPACE 'hobl-jacoco-owned'
          $project=Join-Path $owned 'project'
          if(Test-Path $project){throw 'Fresh ordinary source required'}
          & git -c core.longpaths=true -c core.autocrlf=false clone --no-checkout https://github.com/spring-projects/spring-petclinic.git $project *> (Join-Path $owned 'setup-evidence/clone.log')
          if($LASTEXITCODE-ne0){throw "clone exit=$LASTEXITCODE"}
          & git -c core.longpaths=true -C $project -c core.autocrlf=false checkout --detach 6feeae0f13e0e258eedc99832416b42bb13779b1 *> (Join-Path $owned 'setup-evidence/checkout.log')
          if($LASTEXITCODE-ne0){throw "checkout exit=$LASTEXITCODE"}
          $head=(& git -C $project rev-parse HEAD)
          if($LASTEXITCODE-ne0-or$head-cne'6feeae0f13e0e258eedc99832416b42bb13779b1'){throw 'Source pin differs'}
          @{head=$head;origin='https://github.com/spring-projects/spring-petclinic.git';ordinaryFullClone=$true;source='full canonical Git clone plus exact detach; no borrowed objects/worktree'}|ConvertTo-Json|Set-Content (Join-Path $owned 'setup-evidence/source.json')
      - name: Two full preparations and three alternating offline warm-test pairs
        id: samples
        run: |
          $ErrorActionPreference='Stop';$PSNativeCommandUseErrorActionPreference=$false
          $owned=Join-Path $env:GITHUB_WORKSPACE 'hobl-jacoco-owned'
          $name=if($IsWindows){'python'}else{'python3'}
          $application=Get-Command $name -All -CommandType Application|Select-Object -First 1
          if(-not$application){throw 'Existing standard-library Python required; no install fallback'}
          $python=(Resolve-Path -LiteralPath $application.Source).ProviderPath
          if(-not(Test-Path -LiteralPath $python -PathType Leaf)){throw 'Native Python path absent'}
          @{path=$python;sha256=(Get-FileHash $python).Hash;selection='First existing Application, ProviderPath; outside all test timers'}|ConvertTo-Json|Set-Content (Join-Path $owned 'setup-evidence/python.json')
          & './Generated Files/java-arm-build-optimization/experiments/hobl-jacoco-paired-test/Invoke-HoblJacocoJob.ps1' `
            -ProjectFullClone (Join-Path $owned 'project') -JavaHome $env:JAVA_HOME `
            -LocalCache (Join-Path $owned 'm2') -OutputDirectory (Join-Path $owned 'evidence') `
            -SetupDirectory (Join-Path $owned 'setup-evidence') -PythonExecutable $python `
            -ExecuteAuthorized -CandidateReviewed
      - name: Always retain original step outcomes
        if: always()
        env:
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
          JAVA_OUTCOME: ${{ steps.java.outcome }}
          INTEGRATION_OUTCOME: ${{ steps.integration.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          SAMPLES_OUTCOME: ${{ steps.samples.outcome }}
        run: |
          $setup=Join-Path $env:GITHUB_WORKSPACE 'hobl-jacoco-owned/setup-evidence'
          New-Item $setup -ItemType Directory -Force|Out-Null
          @{archive=$env:ARCHIVE_OUTCOME;java=$env:JAVA_OUTCOME;integration=$env:INTEGRATION_OUTCOME;source=$env:SOURCE_OUTCOME;samples=$env:SAMPLES_OUTCOME}|
            ConvertTo-Json|Set-Content (Join-Path $setup 'outcomes.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hobl-JacocoWarmTest-HOBLDerived-NOT5Loop-NOTBuild-${{ matrix.runner }}-6feeae0-jdk25
          path: |
            hobl-jacoco-owned/setup-evidence
            hobl-jacoco-owned/integration-fixtures
            hobl-jacoco-owned/evidence
          if-no-files-found: error
