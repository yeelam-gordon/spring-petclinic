# INACTIVE TEMPLATE: outside .github. Moving it requires separate approval/budget.
# Configure environment "matched-comparison-approval" with required reviewers FIRST.
# Include these reviewed scripts in the authorized repository; no private paths.
# Hosted Windows ARM (public: 4 CPU/16 GB) and Mac ARM (3 CPU/7 GB) differ.
name: Manual matched ARM64 screen (authorization required)
on:
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: Explicit approved budget; this template grants no permission
        required: true
        type: string
      workload:
        required: true
        type: choice
        default: current17
        options: [current17, normalizedHobl25]
permissions:
  contents: read
jobs:
  compare:
    if: inputs.acknowledgement == 'I_HAVE_APPROVAL_AND_BUDGET'
    environment: matched-comparison-approval
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-11-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: checkout
        with:
          persist-credentials: false
      - name: Initialize separate setup evidence before Java setup
        run: |
          $setup=Join-Path $env:GITHUB_WORKSPACE 'comparison-owned/setup-evidence'
          New-Item $setup -ItemType Directory -Force | Out-Null
          @{status='pending';stage='setup-java';nativeExitCode=$null;error=$null;jdk='not-observed';mvnd='not-observed';compiler='not-observed'} |
            ConvertTo-Json | Set-Content (Join-Path $setup 'setup.json')
      - name: Fetch checksum-pinned official Microsoft JDK without resolver catalog
        id: jdk_archive
        env:
          WORKLOAD: ${{ inputs.workload }}
        run: |
          $ErrorActionPreference='Stop'
          function Get-PinnedMicrosoftJdk([string]$Workload,[bool]$Windows) {
            $build=if($Workload-eq'current17'){'17.0.21.0.2'}elseif($Workload-eq'normalizedHobl25'){'25.0.5.0.2'}else{throw 'Unsupported workload'}
            $os=if($Windows){'windows'}else{'macos'}
            $ext=if($Windows){'zip'}else{'tar.gz'}
            $hashes=@{
              '17.0.21.0.2-windows'='2C0E7679022F1666DA64B586F9941E86481C6F369212E918BE3E505581085336'
              '17.0.21.0.2-macos'='6BC0241428F9485A3AA8FCF606C8395C24A5FF0F6D5E9DAE2C70EAE410A3F5F3'
              '25.0.5.0.2-windows'='F227CC459FBD65A42C1B28123D68E207EB500899C1C78238F21A038CD33688A3'
              '25.0.5.0.2-macos'='C9CF199844411C8BAFD05722D2547538300523A63FF6207A440C71B175FF7873'
            }
            $name="microsoft-jdk-$build-$os-aarch64.$ext"
            return @{name=$name;url="https://aka.ms/download-jdk/$name";sha256=$hashes["$build-$os"];build=$build;javaVersion=$(if($Workload-eq'current17'){'17.0.21'}else{'25.0.5'});expectedRuntime="$build+1-LTS";architecture='aarch64'}
          }
          function Invoke-PinnedMicrosoftJdk([bool]$Windows=$IsWindows) {
            $owned=Join-Path $env:GITHUB_WORKSPACE 'comparison-owned'
            $setup=Join-Path $owned 'setup-evidence'
            New-Item $setup -ItemType Directory -Force|Out-Null
            $pin=Get-PinnedMicrosoftJdk $env:WORKLOAD $Windows
            $archive=Join-Path $owned $pin.name
            $record=@{status='running';stage='jdk-download';nativeExitCode=$null;scriptExitCode=$null;pin=$pin;error=$null}
            try{
              $record|ConvertTo-Json -Depth 6|Set-Content (Join-Path $setup 'jdk-archive.json')
              Invoke-WebRequest $pin.url -OutFile $archive
              $record.stage='jdk-checksum';$record.actualSha256=(Get-FileHash $archive -Algorithm SHA256).Hash
              if($record.actualSha256-ne$pin.sha256){throw 'Official JDK archive checksum mismatch'}
              "jdkFile=$archive"|Add-Content $env:GITHUB_OUTPUT
              "javaVersion=$($pin.javaVersion)"|Add-Content $env:GITHUB_OUTPUT
              $record.status='PASS';$record.scriptExitCode=0
            }catch{$record.status='FAIL';$record.scriptExitCode=1;$record.error=$_.Exception.Message;throw}
            finally{$record|ConvertTo-Json -Depth 6|Set-Content (Join-Path $setup 'jdk-archive.json')}
          }
          Invoke-PinnedMicrosoftJdk
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        id: java
        with:
          distribution: jdkfile
          jdkFile: ${{ steps.jdk_archive.outputs.jdkFile }}
          architecture: aarch64
          java-version: ${{ steps.jdk_archive.outputs.javaVersion }}
          check-latest: false
      - name: Static protocol checks (no Java invoked)
        id: static
        run: |
          & './Generated Files/java-arm-build-optimization/experiments/portable/Test-MatchedComparison.ps1'
      - name: Explicit driver setup, checksum and Windows ARM64 compiler preflight
        id: driver
        env:
          WORKLOAD: ${{ inputs.workload }}
        run: |
          $ErrorActionPreference='Stop'; $PSNativeCommandUseErrorActionPreference=$false
          function Save-Setup { $script:state | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $script:setup 'setup.json') }
          function Stage-Setup($name) { $script:state.stage=$name; $script:state.nativeExitCode=$null; Save-Setup }
          function Start-SetupProcess($file,$arguments,$log) { & $file @arguments *> $log; return $LASTEXITCODE }
          function Native-Setup($name,$file,$arguments) {
            Stage-Setup $name
            $log=Join-Path $script:setup "$name.log"
            $code=Start-SetupProcess $file $arguments $log
            $script:state.nativeExitCode=$code; Save-Setup
            if($code-ne0){throw "$name native exit=$code; see $name.log"}
            return [string](Get-Content $log -Raw)
          }
          function Binary-Setup($path) {
            $b=[IO.File]::ReadAllBytes($path)
            if($b.Length-ge64 -and $b[0]-eq0x4d -and $b[1]-eq0x5a){
              $version=(Get-Item $path).VersionInfo.FileVersion
              return @{format='PE';machine=('0x{0:X4}'-f[BitConverter]::ToUInt16($b,[BitConverter]::ToInt32($b,0x3c)+4));fileVersion=$(if($version){$version}else{'not-observed: no file version resource'});path=$path}
            }
            return @{format='not-observed by PE reader';path=$path}
          }
          function Add-SetupResource($jar,$dll) {
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $archive=[IO.Compression.ZipFile]::Open($jar,[IO.Compression.ZipArchiveMode]::Update)
            try{
              $path='org/mvndaemon/mvnd/nativ/Windows/arm64/mvndnative.dll'
              if($archive.GetEntry($path)){throw 'Unexpected pre-existing prototype resource'}
              [IO.Compression.ZipFileExtensions]::CreateEntryFromFile($archive,$dll,$path)|Out-Null
            }finally{$archive.Dispose()}
          }
          function Invoke-ComparisonSetup([bool]$Windows=$IsWindows) {
          $owned=Join-Path $env:GITHUB_WORKSPACE 'comparison-owned'
          $script:setup=Join-Path $owned 'setup-evidence'
          New-Item $script:setup -ItemType Directory -Force|Out-Null
          $script:state=@{status='running';stage='start';nativeExitCode=$null;scriptExitCode=$null;error=$null;jdk='not-observed';mvnd='not-observed';compiler='not-observed'}
          Save-Setup
          try {
          $java=Join-Path $env:JAVA_HOME $(if($Windows){'bin/java.exe'}else{'bin/java'})
          $identity=Native-Setup 'jdk-identity' $java @('-XshowSettings:properties','-version')
          $script:state.jdk=@{runtime=[regex]::Match($identity,'java.runtime.version = (.+)').Groups[1].Value.Trim();vendor=[regex]::Match($identity,'java.vendor = (.+)').Groups[1].Value.Trim();architecture=[regex]::Match($identity,'os.arch = (.+)').Groups[1].Value.Trim();javaHome=$env:JAVA_HOME}
          if($script:state.jdk.architecture-ne'aarch64'){throw 'Setup Java is not observed native aarch64'}
          $pinnedJdk=Get-Content (Join-Path $script:setup 'jdk-archive.json') -Raw|ConvertFrom-Json
          if($script:state.jdk.runtime-ne$pinnedJdk.pin.expectedRuntime -or $script:state.jdk.vendor-ne'Microsoft'){throw 'Actual runtime differs from pinned Microsoft archive build; possible tool-cache mismatch'}
          $flavor=if($Windows){'windows-amd64'}else{'darwin-aarch64'}
          $hash=if($Windows){'4DD97B1F26525055CEC960FB5B953B70D1E6606F96F5B096EFA932754FD3E9D0238E00CA97779368F29CB751F1776445C45DA618EA8D0D84692C3B936087309F'}else{'CC2887379788BFB54067DEE4F1E9E570624BE0BE6A73025CC59E24D3EE2525CC23D27FC33A58838A0F1A24CB75600FB0CD0AF3F730E70C2DA3660A9F6BF7DF3E'}
          $zip=Join-Path $owned 'vendor.zip'
          Stage-Setup 'vendor-download'
          Invoke-WebRequest "https://archive.apache.org/dist/maven/mvnd/1.0.6/maven-mvnd-1.0.6-$flavor.zip" -OutFile $zip
          Stage-Setup 'vendor-checksum'
          $actualHash=(Get-FileHash $zip -Algorithm SHA512).Hash
          $script:state.archive=@{expectedSha512=$hash;actualSha512=$actualHash}
          if($actualHash -ne $hash){throw 'Vendor ZIP checksum mismatch'}
          Stage-Setup 'vendor-extraction'
          Expand-Archive $zip (Join-Path $owned 'driver')
          $driverHome=Join-Path $owned "driver/maven-mvnd-1.0.6-$flavor"
          if(-not(Test-Path (Join-Path $driverHome 'mvn/lib/mvnd/mvnd-native-1.0.6.jar')) -or -not(Test-Path (Join-Path $driverHome 'mvn/lib/maven-core-3.9.16.jar'))){throw 'Pinned distribution layout/version mismatch'}
          $script:state.mvnd=@{distributionVersion='1.0.6';mavenCore='3.9.16';versionBasis='verified pinned archive checksum and JAR filenames, not a daemon version probe';client='not-observed'}
          if($Windows){
            # Same verified /LD /O2 /MD ARM64 recipe, unchanged public C/header.
            $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            $script:state.mvnd.client=Binary-Setup (Join-Path $driverHome 'bin/mvnd.exe')
            $vs=(Native-Setup 'compiler-discovery' $vswhere @('-latest','-products','*','-requires','Microsoft.VisualStudio.Component.VC.Tools.ARM64','-property','installationPath')).Trim()
            if(-not $vs){throw 'ARM64 MSVC component absent; no install permitted'}
            $native=Join-Path $owned 'native'; New-Item $native -ItemType Directory|Out-Null
            $pin='e0df65807439de579e16632881cf4be14b5a3cca'
            $hashes=@{c='31198B329118419DB30A8178FB438F44953B33F346C30E1BF313DF2F4E6A021E';h='E12BE1E39BB5FD0755B87D151D91712D9606D1118B1F6CCAB6BC2CB0857AA9DF'}
            foreach($ext in 'c','h'){
              $p=Join-Path $native "mvndnative.$ext"
              Stage-Setup "native-source-$ext"
              Invoke-WebRequest "https://raw.githubusercontent.com/apache/maven-mvnd/$pin/native/src/main/native/mvndnative.$ext" -OutFile $p
              if((Get-FileHash $p).Hash-ne$hashes[$ext]){throw 'Public native source checksum mismatch'}
            }
            $dll=Join-Path $native 'mvndnative.dll'
            $cmd="call `"$vs\VC\Auxiliary\Build\vcvarsall.bat`" arm64 >nul && where cl && cl /Bv /nologo /LD /O2 /MD /I`"$env:JAVA_HOME\include`" /I`"$env:JAVA_HOME\include\win32`" /Fo`"$native\mvndnative.obj`" `"$native\mvndnative.c`" /link /MACHINE:ARM64 /OUT:`"$dll`" /IMPLIB:`"$native\mvndnative.lib`""
            $compile=Native-Setup 'native-compile' $env:ComSpec @('/d','/c',$cmd)
            $compilerPath=($compile -split "`r?`n"|Where-Object {$_-match'(?i)cl\.exe$'}|Select-Object -First 1)
            $versionLines=@($compile -split "`r?`n"|Where-Object {$_-match'(?i)version|compiler passes'})
            $script:state.compiler=@{executable=$(if($compilerPath){Binary-Setup $compilerPath.Trim()}else{'not-observed: executable path absent from compiler log'});versionEvidence=$(if($versionLines.Count){$versionLines}else{'not-observed: see native-compile.log'});target=(Binary-Setup $dll)}
            if($script:state.compiler.target.machine-ne'0xAA64'){throw 'Compiled JNI is not ARM64'}
            Stage-Setup 'native-resource-packaging'
            $jar=Join-Path $driverHome 'mvn/lib/mvnd/mvnd-native-1.0.6.jar'
            Add-SetupResource $jar $dll
            Remove-Item (Join-Path $driverHome 'bin/mvnd.exe')
            $script:state.mvnd.mode='LOCAL/UNRELEASED default JVM fallback; inspected AMD64 native client removed'
            'LOCAL/UNRELEASED ARM64 JVM-client prototype; NOT official Apache Windows ARM64 distribution. Original LICENSE/NOTICE retained.' | Set-Content (Join-Path $driverHome 'LOCAL-UNRELEASED.txt')
          }else{
            $script:state.compiler='not-applicable: official Mac distribution; no local compiler invoked'
            $null=Native-Setup 'driver-permissions' 'chmod' @('+x',(Join-Path $driverHome 'bin/mvnd'),(Join-Path $driverHome 'mvn/bin/mvn'))
            $script:state.mvnd.client=Native-Setup 'native-client-architecture' 'file' @((Join-Path $driverHome 'bin/mvnd'))
            if($script:state.mvnd.client-notmatch'arm64'){throw 'Official Mac client architecture is not observed ARM64'}
          }
          $project=Join-Path $owned 'project'
          $null=Native-Setup 'project-clone' 'git' @('-c','core.autocrlf=false','clone','https://github.com/spring-projects/spring-petclinic.git',$project)
          $pin=if($env:WORKLOAD-eq'current17'){'500158f732419217507c7656904b8e6aa1bcc0d6'}else{'6feeae0f13e0e258eedc99832416b42bb13779b1'}
          $null=Native-Setup 'project-checkout' 'git' @('-C',$project,'-c','core.autocrlf=false','checkout','--detach',$pin)
          "MVND_HOME=$driverHome" | Add-Content $env:GITHUB_ENV
          $script:state.status='PASS';$script:state.stage='setup-complete';$script:state.scriptExitCode=0;Save-Setup
          } catch {
            $script:state.status='FAIL';$script:state.scriptExitCode=1;$script:state.error=$_.Exception.Message;Save-Setup
            throw
          }
          }
          Invoke-ComparisonSetup
      - name: Matched package and separate test screen
        id: measurement
        env:
          WORKLOAD: ${{ inputs.workload }}
        run: |
          $owned=Join-Path $env:GITHUB_WORKSPACE 'comparison-owned'
          & './Generated Files/java-arm-build-optimization/experiments/portable/Invoke-MatchedComparison.ps1' `
            -ProjectFullClone (Join-Path $owned 'project') -JavaHome $env:JAVA_HOME -MvndHome $env:MVND_HOME `
            -LocalCache (Join-Path $owned 'm2') -OutputDirectory (Join-Path $owned 'evidence') `
            -Workload $env:WORKLOAD -Samples 3 -LoopbackTests -ExclusiveSlotApproved
      - name: Finalize setup diagnostics even when an action failed
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          JAVA_OUTCOME: ${{ steps.java.outcome }}
          JDK_ARCHIVE_OUTCOME: ${{ steps.jdk_archive.outcome }}
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          DRIVER_OUTCOME: ${{ steps.driver.outcome }}
        run: |
          $setup=Join-Path $env:GITHUB_WORKSPACE 'comparison-owned/setup-evidence'
          New-Item $setup -ItemType Directory -Force | Out-Null
          $path=Join-Path $setup 'setup.json'
          $state=if(Test-Path $path){Get-Content $path -Raw|ConvertFrom-Json -AsHashtable}else{@{status='not-observed';stage='initialization';nativeExitCode=$null;jdk='not-observed';mvnd='not-observed';compiler='not-observed'}}
          $state.actionOutcomes=@{checkout=$env:CHECKOUT_OUTCOME;jdk_archive=$env:JDK_ARCHIVE_OUTCOME;java=$env:JAVA_OUTCOME;static=$env:STATIC_OUTCOME;driver=$env:DRIVER_OUTCOME}
          foreach($key in 'checkout','jdk_archive','java','static','driver'){
            if($state.actionOutcomes[$key]-eq'failure'){
              if($state.status-ne'FAIL'){$state.status='FAIL';$state.stage=$key;$state.nativeExitCode=$null;$state.error="Action step $key failed; native exit not observed by this script; see that step log"}
              break
            }
          }
          $state|ConvertTo-Json -Depth 10|Set-Content $path
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: matched-${{ matrix.runner }}-${{ inputs.workload }}
          path: |
            comparison-owned/setup-evidence
            comparison-owned/evidence
          if-no-files-found: error
